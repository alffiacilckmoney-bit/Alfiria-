<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alfiria - Realm of Cards</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #080c10;
      --gold-accent: #e2c08d;
      --pink-glow: #ff758c;
      --parchment-bg: #f5e5c9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-x pan-y;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-dark);
    }

    /* شاشة النقر الأولى لتفعيل الصوت */
    #start-gate {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1100;
      cursor: pointer;
    }

    .gate-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: var(--gold-accent);
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-weight: 700;
      text-shadow: 0 0 15px rgba(226, 192, 141, 0.3);
    }

    .gate-prompt {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.85rem, 2vw, 1rem);
      color: #fce8cd;
      opacity: 0.85;
      letter-spacing: 1.5px;
      animation: gatePulse 1.8s ease-in-out infinite;
    }

    @keyframes gatePulse {
      0%, 100% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: var(--gold-accent);
      font-family: 'Cinzel', serif;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(226, 192, 141, 0.2);
      border-top: 3px solid var(--gold-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .retry-btn {
      display: none;
      margin-top: 14px;
      background: #5c2f15;
      color: #fce8cd;
      border: 2px solid #e2c08d;
      border-radius: 8px;
      padding: 8px 18px;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      cursor: pointer;
    }

    #map-wrapper {
      position: relative;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--bg-dark);
    }

    #map-blur-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      z-index: 1;
    }

    #map-container {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-aspect-ratio: 13/10) {
      #map-container {
        aspect-ratio: 16 / 9;
        max-width: 100vw;
        max-height: 100dvh;
      }
      #pin-blossom { top: 22.5%; left: 32.5%; }
      #pin-forest { top: 26.5%; left: 66.8%; }
      #pin-ember { top: 68.5%; left: 51.5%; }
    }

    @media (max-aspect-ratio: 13/10) {
      #map-container {
        aspect-ratio: 4 / 3;
        max-width: 100vw;
        max-height: 100dvh;
      }
      #pin-blossom { top: 23%; left: 32%; }
      #pin-forest { top: 28%; left: 67%; }
      #pin-ember { top: 68%; left: 51%; }
    }

    #world-map-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #world-map-img.loaded {
      opacity: 1;
    }

    .island-pin {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .island-pin.visible {
      opacity: 1;
      pointer-events: auto;
      animation: magicPulse 2s ease-in-out infinite;
    }

    .island-pin.locked {
      animation: none !important;
      cursor: pointer;
    }

    .island-pin.locked .pin-icon {
      background: #4a4e57 !important;
      border: 2px solid #a0a6b2 !important;
      opacity: 0.85;
      filter: grayscale(1);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .pin-icon {
      width: clamp(38px, 5.5vw, 48px);
      height: clamp(38px, 5.5vw, 48px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.1rem, 2.2vw, 1.4rem);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 3px solid #fce8cd;
      transition: transform 0.2s ease;
    }

    .island-pin:active .pin-icon {
      transform: scale(1.12);
    }

    #pin-blossom .pin-icon { background: #ff758c; }
    #pin-forest .pin-icon { background: #11998e; }
    #pin-ember .pin-icon { background: #ff416c; }

    @keyframes magicPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 15, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 600;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .parchment-scroll {
      background: var(--parchment-bg);
      width: min(440px, 86vw);
      max-height: 82vh;
      padding: 24px 20px;
      border-radius: 20px;
      border: 3px solid #634327;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow-y: auto;
      position: relative;
    }

    .close-modal-btn {
      position: absolute;
      top: 10px;
      left: 12px;
      background: transparent;
      border: none;
      font-size: 1.25rem;
      font-weight: 700;
      color: #634327;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      line-height: 1;
    }

    .close-modal-btn:active {
      background: rgba(99, 67, 39, 0.15);
      transform: scale(0.9);
    }

    .scroll-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: #4a2810;
      font-weight: 700;
      margin-bottom: 12px;
      padding: 0 20px;
    }

    .scroll-text-container {
      font-size: clamp(0.82rem, 1.8vw, 0.9rem);
      line-height: 1.5;
      color: #2c1a0e;
      text-align: center;
      width: 100%;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .single-button-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 4px;
    }

    .stone-btn {
      background: #5c2f15;
      color: #fce8cd;
      border: 2px solid #3d1c0a;
      border-radius: 8px;
      padding: 9px 26px;
      font-family: 'Cinzel', serif;
      font-size: clamp(0.82rem, 1.8vw, 0.92rem);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
      letter-spacing: 1px;
    }

    .stone-btn:active {
      transform: scale(0.95);
    }

    #game-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      background: rgba(10, 15, 22, 0.96);
      border: 2px solid var(--gold-accent);
      color: var(--gold-accent);
      padding: 14px 22px;
      border-radius: 14px;
      font-size: clamp(0.88rem, 2vw, 0.98rem);
      font-family: 'Cinzel', serif;
      letter-spacing: 0.5px;
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s linear, transform 0.12s ease;
      box-shadow: 0 10px 35px rgba(0,0,0,0.85);
      text-align: center;
      max-width: 85vw;
      line-height: 1.4;
    }

    #game-toast.visible {
      opacity: 1 !important;
      transform: translate(-50%, -50%) scale(1) !important;
    }
  </style>
</head>
<body>

  <!-- شاشة الدخول الأولى لتفعيل الصوت وبدء التحميل -->
  <div id="start-gate" onclick="handleInitialUserTap()">
    <div class="gate-title">ALFIRIA</div>
    <div class="gate-prompt">TAP ANYWHERE TO ENTER</div>
  </div>

  <!-- شاشة التحميل -->
  <div id="loader">
    <div class="spinner" id="loader-spinner"></div>
    <div id="loader-text">Entering Alfiria...</div>
    <button id="retry-btn" class="retry-btn" onclick="retryLoadingMap()">Retry Connection</button>
  </div>

  <div id="map-wrapper">
    <div id="map-blur-bg"></div>
    <div id="map-container">
      <img id="world-map-img" alt="Alfiria Map">

      <div id="pin-blossom" class="island-pin" onclick="openIslandModal(event, 'blossom')">
        <div class="pin-icon">✨️</div>
      </div>

      <div id="pin-forest" class="island-pin locked" onclick="openIslandModal(event, 'forest')">
        <div class="pin-icon">✨️</div>
      </div>

      <div id="pin-ember" class="island-pin locked" onclick="openIslandModal(event, 'ember')">
        <div class="pin-icon">✨️</div>
      </div>
    </div>
  </div>

  <!-- نافذة الجزيرة -->
  <div id="island-modal" class="modal-overlay" onclick="handleOutsideClick(event)">
    <div class="parchment-scroll">
      <button class="close-modal-btn" onclick="closeIslandModal()">✕</button>
      <div id="island-title" class="scroll-title"></div>
      <div id="island-text" class="scroll-text-container" style="white-space: pre-line;"></div>
      <div class="single-button-wrapper">
        <button class="stone-btn" onclick="startQuest()">PLAY</button>
      </div>
    </div>
  </div>

  <div id="game-toast"></div>

  <!-- استدعاء مشغل الصوت -->
  <script src="./js/audio.js?v=1"></script>

  <script>
    const url16x9 = "https://res.cloudinary.com/qc0aowwf/image/upload/f_auto,q_auto,w_1920/v1786395141/make_it_larger_2K_202608102349_1.jpg";
    const url4x3 = "https://res.cloudinary.com/qc0aowwf/image/upload/f_auto,q_auto,w_1600/v1786398462/higher_quality_2K_202608110046_1.jpg";

    const islandData = {
      blossom: {
        title: "🌸 BLOSSOM ISLAND 🌸",
        available: true,
        text: "A gentle path awaits, filled with little questions, playful thoughts, and stories waiting to be shared.\n\nQuestions to make you pause, smile, and discover something new about the people beside you.\n\nReady to take the first step?"
      },
      forest: {
        title: "🌲 WHISPERING FOREST",
        available: false,
        toast: "Coming soon...."
      },
      ember: {
        title: "🌋 EMBER ISLAND",
        available: false,
        toast: "Coming soon...."
      }
    };

    let currentIsland = '';
    let currentMapUrl = '';
    let isAppStarted = false;
    let isNavigating = false;
    let toastTimer = null;
    let isMapLoaded = false;

    const mapImg = document.getElementById('world-map-img');
    const blurBg = document.getElementById('map-blur-bg');
    const startGate = document.getElementById('start-gate');
    const loader = document.getElementById('loader');
    const loaderSpinner = document.getElementById('loader-spinner');
    const loaderText = document.getElementById('loader-text');
    const retryBtn = document.getElementById('retry-btn');
    const pins = document.querySelectorAll('.island-pin');
    const toast = document.getElementById('game-toast');

    function applyBestMap() {
      const aspectRatio = window.innerWidth / window.innerHeight;
      const targetUrl = (aspectRatio >= 1.3) ? url16x9 : url4x3;
      if (currentMapUrl !== targetUrl) {
        currentMapUrl = targetUrl;
        mapImg.src = targetUrl;
        blurBg.style.backgroundImage = `url("${targetUrl}")`;
      }
    }
    applyBestMap();

    function preloadStandbyMap() {
      const standbyUrl = (currentMapUrl === url16x9) ? url4x3 : url16x9;
      const standbyImg = new Image();
      standbyImg.src = standbyUrl;
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(applyBestMap, 200);
    });


    function onMapImageLoaded() {
      isMapLoaded = true;
      preloadStandbyMap();
      // إذا كان اللاعب قد ضغط وبدأ التحميل، نُظهر الخريطة فوراً
      if (loader.style.display === 'flex') {
        finishAndShowMap();
      }
    }

        // التعامل مع أول لمسة: نفعّل محرك الصوت فقط ونبدأ التحميل
    function handleInitialUserTap() {
      if (typeof SoundManager !== 'undefined') {
        SoundManager.init(); // تجهيز الصوت ورفع الحظر
      }

      startGate.style.display = 'none';
      loader.style.display = 'flex';

      if (isMapLoaded) {
        finishAndShowMap();
      }
    }

    // انتهاء التحميل: إخفاء اللودر، كشف الخريطة، وتشغيل صوت الإنترو فوراً
    function finishAndShowMap() {
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
          mapImg.classList.add('loaded');
          pins.forEach(pin => pin.classList.add('visible'));

          // تشغيل صوت الإنترو لحظة ظهور الخريطة والدبابيس
          if (typeof SoundManager !== 'undefined') {
            SoundManager.play('intro');
          }
        }, 350);
      }, 500);
    }

    function handleMapLoadError() {
      loaderSpinner.style.display = 'none';
      loaderText.innerText = 'Connection Lost, Unable to reach Alfiria';
      retryBtn.style.display = 'inline-block';
    }

    function retryLoadingMap() {
      loaderSpinner.style.display = 'block';
      loaderText.innerText = 'Entering Alfiria...';
      retryBtn.style.display = 'none';
      mapImg.src = currentMapUrl + '?t=' + Date.now();
    }

    if (mapImg.complete && mapImg.naturalWidth !== 0) {
      onMapImageLoaded();
    } else {
      mapImg.onload = onMapImageLoaded;
      mapImg.onerror = handleMapLoadError;
    }

    // فحص ما إذا كان اللاعب عائداً من داخل اللعبة
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('from') === 'game') {
      startGate.style.display = 'none';
      loader.style.display = 'none';
      mapImg.classList.add('loaded');
      pins.forEach(pin => pin.classList.add('visible'));
    }

    function showToast(message) {
      if (toastTimer) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }
      
      toast.innerText = message;
      toast.classList.add('visible');

      toastTimer = setTimeout(() => {
        toast.classList.remove('visible');
        toastTimer = null;
      }, 500);
    }

    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('.island-pin') && toast.classList.contains('visible')) {
        if (toastTimer) clearTimeout(toastTimer);
        toast.classList.remove('visible');
        toastTimer = null;
      }
    });

    function openIslandModal(event, islandKey) {
      if (event) event.stopPropagation();

      currentIsland = islandKey;
      const data = islandData[islandKey];
      if (!data) return;

      if (!data.available) {
        showToast(data.toast || "This island is currently locked.");
        return;
      }

      if (typeof SoundManager !== 'undefined') {
        SoundManager.play('islandClick');
      }

      document.getElementById('island-title').innerText = data.title;
      document.getElementById('island-text').innerText = data.text;
      const modal = document.getElementById('island-modal');
      if (modal) modal.classList.add('active');
    }

    function closeIslandModal() {
      const modal = document.getElementById('island-modal');
      if (modal) modal.classList.remove('active');
    }

    function handleOutsideClick(e) {
      if (e.target.classList.contains('modal-overlay')) {
        closeIslandModal();
      }
    }

    function startQuest() {
      if (isNavigating) return;

      if (currentIsland === 'blossom') {
        if (typeof SoundManager !== 'undefined') {
          SoundManager.play('islandClick');
        }

        isNavigating = true;
        const playBtn = document.querySelector('#island-modal .stone-btn');
        if (playBtn) {
          playBtn.disabled = true;
          playBtn.style.opacity = '0.6';
          playBtn.style.cursor = 'not-allowed';
          playBtn.innerText = 'Entering...';
        }
        window.location.href = "blossom.html";
      }
    }

    window.addEventListener('pageshow', () => {
      isNavigating = false;
      const playBtn = document.querySelector('#island-modal .stone-btn');
      if (playBtn) {
        playBtn.disabled = false;
        playBtn.style.opacity = '1';
        playBtn.style.cursor = 'pointer';
        playBtn.innerText = 'PLAY';
      }
    });

    document.addEventListener('dblclick', (e) => {
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
